<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anime Playlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="hero">
    <div class="overlay">
      <h1>WATCH LIST</h1>
      <p>Build your anime Playlist</p>
    </div>
  </section>

  <section class="add-anime">
    <h2>Search Anime</h2>
    <input type="text" id="searchInput" placeholder="Search anime..." />
  </section>

  <section class="watchlist">
    <h2>Our Anime</h2>
    <div class="grid-container" id="animeGrid"></div>
  </section>

  <section class="watchlist">
    <h2>YOUR PLAYLIST</h2>
    <div class="grid-container" id="playlistGrid"></div>
  </section>

  <script src="home.js"></script>
</body>
</html>
